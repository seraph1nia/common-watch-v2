name: MonoGame

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install pinned mise tools
        uses: jdx/mise-action@v5.2.0
        with:
          install_args: --locked

      - name: Check graphical prerequisites
        run: |
          for prerequisite in Xvfb xvfb-run xauth timeout python3; do
            command -v "$prerequisite" >/dev/null || { echo "Missing graphical prerequisite: $prerequisite" >&2; exit 1; }
          done
          python3 -c 'import ctypes; ctypes.CDLL("libGL.so.1")'

      - name: Build solution with locked dependencies
        run: mise run build

      - name: Test Core
        run: mise run test-core

      - name: Test shared adapter and presentation
        run: mise run test-shared

      - name: Test artwork pipeline
        run: |
          mise run art-setup
          mise run test-art

      - name: Test offline MonoGame sessions and Steam integration
        run: mise run test-monogame-steam

      - name: Test MonoGame UI, multiplayer and reconnect on virtual displays
        run: >-
          mise exec -- dotnet test tests/Game.Integration.Tests/Game.Integration.Tests.csproj
          --no-build --no-restore --filter 'Client=monogame' --nologo
          --logger 'trx;LogFileName=monogame.trx' --results-directory artifacts/test-results

      - name: Build Linux x64 release
        run: mise run build-monogame-linux

      - name: Build Windows x64 release
        run: mise run build-monogame-windows

      - name: Archive complete release folders
        run: |
          test -x artifacts/builds/monogame/linux/Game.MonoGame
          test -s artifacts/builds/monogame/windows/Game.MonoGame.exe
          mkdir -p artifacts/packages
          tar -czf artifacts/packages/common-watch-monogame-linux-x64.tar.gz -C artifacts/builds/monogame/linux .
          python3 -c 'import shutil; shutil.make_archive("artifacts/packages/common-watch-monogame-windows-x64", "zip", "artifacts/builds/monogame/windows")'

      - name: Upload Linux release
        uses: actions/upload-artifact@v7.0.2
        with:
          path: artifacts/packages/common-watch-monogame-linux-x64.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload Windows release
        uses: actions/upload-artifact@v7.0.2
        with:
          path: artifacts/packages/common-watch-monogame-windows-x64.zip
          archive: false
          if-no-files-found: error

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: monogame-test-diagnostics
          path: |
            artifacts/test-logs/
            artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7
