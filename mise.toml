[tools]
dotnet = "10.0.401"
[tool_alias]
godot-dotnet = "github:godotengine/godot"
[tools.godot-dotnet]
version = "4.7.2-stable"
[tools.godot-dotnet.platforms.linux-x64]
asset_pattern = "Godot_v{{ version }}_mono_linux*x86_64.zip"
strip_components = 1
bin_path = "."
rename_exe = { "Godot_v*_mono_linux*" = "godot" }
[settings]
task.run_auto_install = false
exec_auto_install = false
[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.build]
description = "Restore locked dependencies and compile the complete solution"
run = ["python3 tools/verify-dependency-pins.py", "dotnet restore CommonWatch.slnx --locked-mode", "dotnet build CommonWatch.slnx --no-restore --nologo"]

[tasks.build-godot-windows]
description = "Export a self-contained Godot Windows x64 release into artifacts/builds"
run = "bash tools/build-client.sh godot windows"

[tasks.build-godot-linux]
description = "Export a self-contained Godot Linux x64 release into artifacts/builds"
run = "bash tools/build-client.sh godot linux"

[tasks.build-monogame-windows]
description = "Publish a self-contained MonoGame Windows x64 release into artifacts/builds"
run = "bash tools/build-client.sh monogame windows"

[tasks.build-monogame-linux]
description = "Publish a self-contained MonoGame Linux x64 release into artifacts/builds"
run = "bash tools/build-client.sh monogame linux"

[tasks.test-core]
description = "Headless authoritative simulation tests"
run = ["dotnet restore tests/Game.Core.Tests/Game.Core.Tests.csproj --locked-mode", "dotnet test tests/Game.Core.Tests/Game.Core.Tests.csproj --no-restore --nologo"]

[tasks.test-shared]
description = "Headless adapter, projection, assets and deterministic scenario tests"
run = ["dotnet restore tests/Game.Shared.Tests/Game.Shared.Tests.csproj --locked-mode", "dotnet test tests/Game.Shared.Tests/Game.Shared.Tests.csproj --no-restore --nologo"]

[tasks.test]
description = "All Core, shared and actual graphical integration tests"
depends = ["build"]
run = [".venv-art/bin/python -m unittest discover -s tests/art -v", "dotnet test CommonWatch.slnx --no-build --no-restore --nologo"]

[tasks.scenario]
description = "Replay the authoritative first-wave scenario and write JSON checkpoints"
run = "dotnet run --project tools/scenarios/Scenarios.csproj --"
raw_args = true

[tasks.play-godot]
description = "Play Godot 2D with shapes and text (default)"
depends = ["build"]
run = "bash tools/client.sh godot --render-mode debug"
raw_args = true

[tasks.play-godot-no-assets]
description = "Play Godot explicitly ignoring all optional sprites"
depends = ["build"]
run = "bash tools/client.sh godot --render-mode debug"
raw_args = true

[tasks.play-godot-assets]
description = "Play Godot with optional sprite loading and geometric fallback"
depends = ["build"]
run = "bash tools/client.sh godot --render-mode sprites"
raw_args = true

[tasks.play-monogame]
description = "Play MonoGame with shapes and text (default)"
depends = ["build"]
run = "bash tools/client.sh monogame --render-mode debug"
raw_args = true

[tasks.play-monogame-no-assets]
description = "Play MonoGame explicitly ignoring all optional sprites"
depends = ["build"]
run = "bash tools/client.sh monogame --render-mode debug"
raw_args = true

[tasks.play-monogame-assets]
description = "Play MonoGame with optional sprite loading and geometric fallback"
depends = ["build"]
run = "bash tools/client.sh monogame --render-mode sprites"
raw_args = true

[tasks.test-godot]
description = "Godot graphical integration checks in both rendering modes"
depends = ["build"]
run = "dotnet test tests/Game.Integration.Tests/Game.Integration.Tests.csproj --no-build --no-restore --filter 'Client=godot&FullyQualifiedName~ClientTests' --nologo"

[tasks.test-monogame]
description = "MonoGame graphical integration checks in both rendering modes"
depends = ["build"]
run = "dotnet test tests/Game.Integration.Tests/Game.Integration.Tests.csproj --no-build --no-restore --filter 'Client=monogame&FullyQualifiedName~ClientTests' --nologo"

[tasks.capture-godot]
description = "Capture four actual rendered Godot checkpoints on an owned virtual display"
depends = ["build"]
run = "bash tools/graphical.sh godot capture"
raw_args = true

[tasks.capture-monogame]
description = "Capture four actual rendered MonoGame checkpoints on an owned virtual display"
depends = ["build"]
run = "bash tools/graphical.sh monogame capture"
raw_args = true

[tasks.test-godot-session]
description = "Actual Godot menu, doctrine, replacement and gameplay lifecycle checks"
depends = ["test-godot"]

[tasks.test-monogame-session]
description = "Actual Gum menu, doctrine, replacement and gameplay lifecycle checks"
depends = ["test-monogame"]

[tasks.test-godot-multiplayer]
description = "Actual godot LAN processes: two, three and four players through combat and drafting"
depends = ["build"]
run = "bash tools/multiplayer.sh godot test"
raw_args = true

[tasks.dev-godot-multiplayer]
description = "Launch a LAN host and guests with normal graphics/audio; --players 1..4"
depends = ["build"]
run = "bash tools/multiplayer.sh godot dev"
raw_args = true

[tasks.test-monogame-multiplayer]
description = "Actual monogame LAN processes: two, three and four players through combat and drafting"
depends = ["build"]
run = "bash tools/multiplayer.sh monogame test"
raw_args = true

[tasks.dev-monogame-multiplayer]
description = "Launch a LAN host and guests with normal graphics/audio; --players 1..4"
depends = ["build"]
run = "bash tools/multiplayer.sh monogame dev"
raw_args = true

[tasks.test-godot-lobby]
description = "Actual godot lobby checks"
depends = ["test-godot-multiplayer"]

[tasks.test-godot-reconnect]
description = "Actual godot reconnect checks"
depends = ["build"]
run = "bash tools/reconnect.sh godot"

[tasks.test-godot-network-faults]
description = "Actual godot network-faults checks"
depends = ["test-godot-reconnect"]

[tasks.capture-godot-lobby]
description = "Capture the actual two-, three- and four-player native lobby controls"
depends = ["test-godot-multiplayer"]

[tasks.test-monogame-lobby]
description = "Actual monogame lobby checks"
depends = ["test-monogame-multiplayer"]

[tasks.test-monogame-reconnect]
description = "Actual monogame reconnect checks"
depends = ["build"]
run = "bash tools/reconnect.sh monogame"

[tasks.test-monogame-network-faults]
description = "Actual monogame network-faults checks"
depends = ["test-monogame-reconnect"]

[tasks.capture-monogame-lobby]
description = "Capture the actual two-, three- and four-player native lobby controls"
depends = ["test-monogame-multiplayer"]

[tasks.test-godot-steam]
description = "Offline Godot Steam operation, metadata and authenticated admission tests"
depends = ["build"]
run = "dotnet test tests/Game.Godot.Session.Tests/Game.Godot.Session.Tests.csproj --no-build --no-restore --nologo"

[tasks.play-godot-steam]
description = "Optional Steam startup using COMMON_WATCH_STEAM_APP_ID; offline fallback remains available"
depends = ["build"]
run = "bash tools/client.sh godot --render-mode debug --steam"
raw_args = true

[tasks.test-godot-steam-native]
description = "Explicitly gated live Steam SDK/gameplay worker; see docs/SESSIONS.md"
depends = ["build"]
run = "bash tools/steam-native.sh godot"
raw_args = true

[tasks.test-monogame-steam]
description = "Offline MonoGame Steam operation, metadata and authenticated admission tests"
depends = ["build"]
run = "dotnet test tests/Game.MonoGame.Session.Tests/Game.MonoGame.Session.Tests.csproj --no-build --no-restore --nologo"

[tasks.play-monogame-steam]
description = "Optional Steam startup using COMMON_WATCH_STEAM_APP_ID; offline fallback remains available"
depends = ["build"]
run = "bash tools/client.sh monogame --render-mode debug --steam"
raw_args = true

[tasks.test-monogame-steam-native]
description = "Explicitly gated live Steam SDK/gameplay worker; see docs/SESSIONS.md"
depends = ["build"]
run = "bash tools/steam-native.sh monogame"
raw_args = true

[tasks.art-setup]
description = "Create the local Pillow environment (no archive import)"
run = ["python3 -m venv .venv-art", ".venv-art/bin/pip install -r tools/art/requirements.txt"]

[tasks.art-process]
description = "Crop existing source PNGs and prepare deterministic staged sprites, metadata and previews"
run = ".venv-art/bin/python tools/art/pipeline.py process"

[tasks.art-validate]
description = "Validate staged PNGs, metadata, source hashes and nine-slice margins"
run = ".venv-art/bin/python tools/art/pipeline.py validate"

[tasks.art-install]
description = "Install validated staged PNGs and catalog into assets"
run = ".venv-art/bin/python tools/art/pipeline.py install"

[tasks.art-preview]
description = "Render contact sheet and multi-size nine-slice previews"
run = ".venv-art/bin/python tools/art/pipeline.py preview"

[tasks.test-art]
description = "Test Pillow cropping, alpha, anchors, nine-slicing and deterministic processing"
run = ".venv-art/bin/python -m unittest discover -s tests/art -v"

[tasks.art-showroom-godot]
description = "Inspect installed artwork and native nine-slices without a running match"
depends = ["build"]
run = "bash tools/client.sh godot --asset-showroom --world-art sprites --hud-art illustrated --debug-overlay on --width 1280 --height 1080"
raw_args = true

[tasks.art-showroom-monogame]
description = "Inspect installed artwork and native Gum nine-slices without a running match"
depends = ["build"]
run = "bash tools/client.sh monogame --asset-showroom --world-art sprites --hud-art illustrated --debug-overlay on --width 1280 --height 1080"
raw_args = true

[tasks.capture-godot-art]
description = "Capture nine actual Godot artwork verification views on an owned display"
depends = ["build"]
run = "bash tools/graphical.sh godot capture-art"

[tasks.capture-monogame-art]
description = "Capture nine actual MonoGame/Gum artwork verification views on an owned display"
depends = ["build"]
run = "bash tools/graphical.sh monogame capture-art"
