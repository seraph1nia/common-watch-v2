[tools]
dotnet = "10.0.401"
[tool_alias]
godot-dotnet = "github:godotengine/godot"
[tools.godot-dotnet]
version = "4.7.2-stable"
[tools.godot-dotnet.platforms.linux-x64]
asset_pattern = "Godot_v{{ version }}_mono_linux*x86_64.zip"
strip_components = 1
bin_path = "."
rename_exe = { "Godot_v*_mono_linux*" = "godot" }
[settings]
task.run_auto_install = false
exec_auto_install = false
[env]
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[tasks.build]
description = "Restore locked dependencies and compile the complete solution"
run = ["python3 tools/verify-dependency-pins.py", "dotnet restore CommonWatch.slnx --locked-mode", "dotnet build CommonWatch.slnx --no-restore --nologo"]

[tasks.build-windows]
description = "Export a self-contained Godot Windows x64 release into artifacts/builds"
run = "bash tools/build-client.sh windows"

[tasks.build-linux]
description = "Export a self-contained Godot Linux x64 release into artifacts/builds"
run = "bash tools/build-client.sh linux"

[tasks.test-core]
description = "Headless authoritative simulation tests"
run = ["dotnet restore tests/Game.Core.Tests/Game.Core.Tests.csproj --locked-mode", "dotnet test tests/Game.Core.Tests/Game.Core.Tests.csproj --no-restore --nologo"]

[tasks.test-shared]
description = "Headless adapter, projection, assets and deterministic scenario tests"
run = ["dotnet restore tests/Game.Shared.Tests/Game.Shared.Tests.csproj --locked-mode", "dotnet test tests/Game.Shared.Tests/Game.Shared.Tests.csproj --no-restore --nologo"]

[tasks.test]
description = "All Core, shared and actual graphical integration tests"
depends = ["build"]
run = [".venv-art/bin/python -m unittest discover -s tests/art -v", "dotnet test CommonWatch.slnx --no-build --no-restore --nologo", "bash tools/graphical.sh capture-battle --no-sequence"]

[tasks.scenario]
description = "Replay the authoritative first-wave scenario and write JSON checkpoints"
run = "dotnet run --project tools/scenarios/Scenarios.csproj --"
raw_args = true

[tasks.play]
description = "Play Godot 2D with shapes and text (default)"
depends = ["build"]
run = "bash tools/client.sh --render-mode debug"
raw_args = true

[tasks.play-assets]
description = "Play Godot with optional sprites and illustrated HUD, with plain/geometric fallback"
depends = ["build"]
run = "bash tools/client.sh --render-mode sprites --hud-art illustrated --view angled"
raw_args = true

[tasks.test-graphics]
description = "Godot graphical integration checks in both rendering modes"
depends = ["build"]
run = "dotnet test tests/Game.Integration.Tests/Game.Integration.Tests.csproj --no-build --no-restore --filter 'FullyQualifiedName~ClientTests' --nologo"

[tasks.capture]
description = "Capture four actual rendered Godot checkpoints on an owned virtual display"
depends = ["build"]
run = "bash tools/graphical.sh capture"
raw_args = true

[tasks.test-session]
description = "Actual Godot menu, doctrine, replacement and gameplay lifecycle checks"
depends = ["test-graphics"]

[tasks.test-multiplayer]
description = "Actual godot LAN processes: two, three and four players through combat and drafting"
depends = ["build"]
run = "bash tools/multiplayer.sh test"
raw_args = true

[tasks.dev-multiplayer]
description = "Launch a LAN host and guests with normal graphics/audio; --players 1..4"
depends = ["build"]
run = "bash tools/multiplayer.sh dev"
raw_args = true

[tasks.test-lobby]
description = "Actual godot lobby checks"
depends = ["test-multiplayer"]

[tasks.test-reconnect]
description = "Actual godot reconnect checks"
depends = ["build"]
run = "bash tools/reconnect.sh"

[tasks.test-network-faults]
description = "Actual godot network-faults checks"
depends = ["test-reconnect"]

[tasks.capture-lobby]
description = "Capture the actual two-, three- and four-player native lobby controls"
depends = ["test-multiplayer"]

[tasks.test-steam]
description = "Offline Godot Steam operation, metadata and authenticated admission tests"
depends = ["build"]
run = "dotnet test tests/Game.Godot.Session.Tests/Game.Godot.Session.Tests.csproj --no-build --no-restore --nologo"

[tasks.play-steam]
description = "Optional Steam startup using COMMON_WATCH_STEAM_APP_ID; offline fallback remains available"
depends = ["build"]
run = "bash tools/client.sh --render-mode debug --steam"
raw_args = true

[tasks.test-steam-native]
description = "Explicitly gated live Steam SDK/gameplay worker; see docs/SESSIONS.md"
depends = ["build"]
run = "bash tools/steam-native.sh"
raw_args = true

[tasks.art-setup]
description = "Create the local Pillow environment (no archive import)"
run = ["python3 -m venv .venv-art", ".venv-art/bin/pip install -r tools/art/requirements.txt"]

[tasks.art-process]
description = "Crop existing source PNGs and prepare deterministic staged sprites, metadata and previews"
run = ".venv-art/bin/python tools/art/pipeline.py process"

[tasks.art-validate]
description = "Validate staged PNGs, metadata, source hashes and nine-slice margins"
run = ".venv-art/bin/python tools/art/pipeline.py validate"

[tasks.art-install]
description = "Install validated staged PNGs and catalog into assets"
run = ".venv-art/bin/python tools/art/pipeline.py install"

[tasks.art-preview]
description = "Render contact sheet and multi-size nine-slice previews"
run = ".venv-art/bin/python tools/art/pipeline.py preview"

[tasks.test-art]
description = "Test Pillow cropping, alpha, anchors, nine-slicing and deterministic processing"
run = ".venv-art/bin/python -m unittest discover -s tests/art -v"

[tasks.art-showroom]
description = "Inspect installed artwork and native nine-slices without a running match"
depends = ["build"]
run = "bash tools/client.sh --asset-showroom --world-art sprites --hud-art illustrated --debug-overlay on --width 1280 --height 1080"
raw_args = true

[tasks.capture-art]
description = "Capture nine actual Godot artwork verification views on an owned display"
depends = ["build"]
run = "bash tools/graphical.sh capture-art"

[tasks.capture-settlement]
description = "Verify nine painted pads, native picking/purchase and capture the actual settlement map"
depends = ["build"]
run = "bash tools/graphical.sh capture-settlement"

[tasks.battle]
description = "Animated tabletop battle showcase, native Godot controls, default debug art"
depends = ["build"]
run = "bash tools/client.sh --battle swordsman --world-art debug"
raw_args = true

[tasks.battle-assets]
description = "Godot battle with the two existing static character PNGs"
depends = ["build"]
run = "bash tools/client.sh --battle swordsman --world-art sprites --view angled"
raw_args = true

[tasks.capture-battle]
description = "Actual Godot animation phases and ordered frames with tick/event metadata"
depends = ["build"]
run = "bash tools/graphical.sh capture-battle"
raw_args = true

[tasks.test-animation]
description = "Godot pose/lifecycle and actual rendered animation checks"
depends = ["build"]
run = ["dotnet test tests/Game.Godot.Session.Tests --no-build --no-restore --filter FullyQualifiedName~Animation --nologo", "bash tools/graphical.sh capture-battle --no-sequence"]

[tasks.profile-animation]
description = "Nine repeated native battles at 30/60/120 FPS and all three combat speeds"
depends = ["build"]
run = "bash tools/graphical.sh profile-battle"

[tasks.review-battle]
description = "Build the local HTML review from actual captured frames and profile receipts"
run = "python3 tools/battle-review.py"

[tasks.test-gameplay-ui]
description = "Actual native gameplay controls over paid default-rule campaign scenarios"
depends = ["build"]
run = ["bash tools/graphical.sh test-gameplay", "bash tools/graphical.sh test-gameplay-network"]

[tasks.capture-gameplay-ui]
description = "Capture actual native gameplay panels and terminal states"
depends = ["build"]
run = ["bash tools/graphical.sh capture-gameplay", "bash tools/graphical.sh test-gameplay-network"]

[tasks.capture-worldtree]
description = "Verify native illustrated Worldtree input/purchases and capture five states at 720p/1080p"
depends = ["build"]
run = "bash tools/graphical.sh capture-worldtree"
raw_args = true
